[package]
name = "seepdf"
version = "0.1.0"
description = "SeePDF - lightweight, powerful PDF editor with OCR"
authors = ["hwpark"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "seepdf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `thread_safe` is deliberately NOT enabled: pdfium types stay `!Send` so the compiler
# enforces "every pdfium call happens on the engine thread" (ARCHITECTURE D1/D2).
# `flatten` is deliberately NOT enabled: it is FLAT_PRINT, which deletes annotations
# without the Print flag; we call FPDFPage_Flatten(FLAT_NORMALDISPLAY) through engine::raw.
pdfium-render = { version = "0.9", default-features = false, features = [
  "pdfium_7881",
  "image_025",
] }
png = "0.18"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
thiserror = "2"
parking_lot = "0.12"
crossbeam-channel = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
ttf-parser = "0.25"

# The only fork in the project: five additive `raw_handle()` / `raw_bindings()`
# accessors (ARCHITECTURE §1.3). The diff is kept in `docs/pdfium-patch.diff`.
[dev-dependencies]
subsetter = "0.2"

[patch.crates-io]
pdfium-render = { path = "../vendor/pdfium-render" }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Mandatory: without it PNG encoding is 141-260 ms per page instead of 2.3 ms and every
# `tauri dev` measurement is meaningless (WORKPLAN §0.6, render spike §4).
[profile.dev.package."*"]
opt-level = 3
