[package]
name = "seepdf"
version = "0.2.0"
description = "SeePDF - lightweight, powerful PDF editor with OCR"
authors = ["hwpark"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "seepdf_lib"
# `rlib` only, on purpose. The Tauri template ships `["staticlib", "cdylib", "rlib"]` so the
# same crate can be linked into an iOS/Android host; SeePDF is desktop-only (macOS + Windows)
# and `src/main.rs` links the `rlib`. Keeping the other two made every build print
#   `warning: output filename collision at .../libseepdf_lib.{a,dylib,rlib}`
# and made `cargo test --release` fail roughly one run in three with 173 errors of
# `crate X requires panic strategy 'abort' ... incompatible with 'unwind'` (`[profile.release]
# panic = "abort"` applies to the cdylib/staticlib units but not to test harnesses, and the
# colliding artifact paths let a test target link the wrong unit) — STAGE1B_NOTES §5.3.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
# 업데이트 확인 (v0.2.0). `~2.12` / `~2.3`: the next minors need tauri 2.12, and the npm
# packages (`@tauri-apps/plugin-updater` / `-process`) must stay on the same minor.
# `native-tls` instead of the default rustls+ring: schannel on Windows and Security.framework
# on macOS are already on the machine, so nothing new is compiled from C and the binary does
# not carry a TLS stack of its own. `system-proxy` because SeePDF runs behind corporate proxies.
tauri-plugin-updater = { version = "~2.12", default-features = false, features = [
  "native-tls",
  "system-proxy",
  "zip",
] }
tauri-plugin-process = "~2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `thread_safe` is deliberately NOT enabled: pdfium types stay `!Send` so the compiler
# enforces "every pdfium call happens on the engine thread" (ARCHITECTURE D1/D2).
# `flatten` is deliberately NOT enabled: it is FLAT_PRINT, which deletes annotations
# without the Print flag; we call FPDFPage_Flatten(FLAT_NORMALDISPLAY) through engine::raw.
pdfium-render = { version = "0.9", default-features = false, features = [
  "pdfium_7881",
  "image_025",
] }
png = "0.18"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
thiserror = "2"
parking_lot = "0.12"
crossbeam-channel = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
ttf-parser = "0.25"
# P1-1 / P1-3: /Info + XMP rewrite and AES-256 (V5/R6) encryption. PDFium can read both but
# write neither (no FPDF_SetMetaText, no encrypt API). Default features off: no rayon, no chrono.
lopdf = { version = "0.45", default-features = false }
# The 32-byte AES-256 file key. Same major as lopdf's own dependency, so nothing new is built.
getrandom = "0.4"
# Local-time ModDate for set_metadata. Already in the tree (pdfium-render), same features.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# P1-11: macOS Vision OCR (`ocr_recognize_native`). The same objc2 0.6 / 0.3.2 family Tauri
# already links on macOS, so this adds bindings, not a second runtime. Default features off: the
# framework crates enable every class of their framework by default.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSArray",
  "NSError",
  "NSDictionary",
  "NSObject",
  "NSProcessInfo",
  "NSRange",
  "NSString",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "CFCGTypes",
  "CFData",
] }
objc2-core-graphics = { version = "0.3", default-features = false, features = [
  "std",
  "CGImage",
  "CGColorSpace",
  "CGDataProvider",
] }
objc2-vision = { version = "0.3", default-features = false, features = [
  "std",
  "objc2-core-foundation",
  "objc2-core-graphics",
  "VNObservation",
  "VNRecognizeTextRequest",
  "VNRequest",
  "VNRequestHandler",
  "VNTypes",
] }

# v0.3 pkg7-ocr (O3): native Windows OCR (`Windows.Media.Ocr`) behind `ocr_recognize_native`.
# 0.61 is the `windows` Tauri already links on Windows, so this adds WinRT bindings, not a
# second copy of the crate.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Foundation",
  "Foundation_Collections",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage_Streams",
] }

# The only fork in the project: five additive `raw_handle()` / `raw_bindings()`
# accessors (ARCHITECTURE §1.3). The diff is kept in `docs/pdfium-patch.diff`.
[dev-dependencies]
subsetter = "0.2"

[patch.crates-io]
pdfium-render = { path = "../vendor/pdfium-render" }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Mandatory: without it PNG encoding is 141-260 ms per page instead of 2.3 ms and every
# `tauri dev` measurement is meaningless (WORKPLAN §0.6, render spike §4).
[profile.dev.package."*"]
opt-level = 3
