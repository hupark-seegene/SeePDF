name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to a PR branch supersedes the running check, but a push to main never cancels
# the run in progress: until Stage 9 every main run was cancelled this way (or sat queued on
# a retired runner label), so the Windows job had never once finished. GitHub still keeps at
# most one *pending* run per group, so a burst of pushes costs one extra run, not N.
#
# The group name changed with that fix (`ci-` → `ci-build-`): the last run under the old name
# is stuck in the queue on `macos-13`, and a new run in the same group would wait behind it.
concurrency:
  group: ci-build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Fast feedback that needs no Rust toolchain and no pdfium.
  frontend:
    name: frontend (typecheck · vitest · i18n)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install (no pdfium download needed for these checks)
        run: npm ci --ignore-scripts
      - run: node scripts/check-i18n.mjs --strict
      # v0.3 pkg5: installer languages / WebView2 modes / macOS 13 / Intel assets / notices
      - run: node scripts/check-release-config.mjs
      - run: npm run typecheck
      - name: vitest
        run: bash scripts/ci-run.sh vitest npx vitest run
      - name: Production build against the mock adapter
        run: npm run build
        env:
          VITE_SEEPDF_MOCK: "1"
      - run: node scripts/check-bundle-size.mjs

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          # `macos-13` was retired; its jobs sat in the queue until the 24 h timeout.
          - name: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Pinned to the toolchain the tree is developed with (CLAUDE.md), so a new stable's
      # lints cannot turn `clippy -D warnings` red overnight. Bump together with local rustup.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      # postinstall runs scripts/fetch-pdfium.mjs, which honours PDFIUM_TARGET.
      - name: npm ci (fetches libpdfium for ${{ matrix.target }})
        run: npm ci
        env:
          PDFIUM_TARGET: ${{ matrix.target }}

      - run: npm run typecheck
      # v0.3 pkg5 (H11): the licence notices build from cargo metadata + the npm tree on every target
      - run: node scripts/gen-notices.mjs --check
      - name: vitest
        shell: bash
        run: bash scripts/ci-run.sh vitest npx vitest run

      # `scripts/ci-run.sh` republishes a failure's key lines as annotations, which the public
      # REST API serves without a login (job logs need one).
      - name: cargo fmt
        working-directory: src-tauri
        shell: bash
        run: bash ../scripts/ci-run.sh "cargo fmt" cargo fmt --check

      - name: cargo clippy
        working-directory: src-tauri
        shell: bash
        run: bash ../scripts/ci-run.sh "cargo clippy" cargo clippy --target ${{ matrix.target }} -- -D warnings

      # Two invocations on purpose. Building the test binaries first and only then running
      # them is deterministic; `cargo test --release` on its own used to fail roughly one run
      # in three with `crate X requires panic strategy 'abort'` (STAGE1B_NOTES §5.3). Stage 2
      # removed the root cause — `crate-type` is `["rlib"]` now, not
      # `["staticlib", "cdylib", "rlib"]` — and the split invocation is kept because it also
      # separates a compile failure from a test failure in the CI log.
      - name: cargo build --release --tests
        working-directory: src-tauri
        shell: bash
        run: bash ../scripts/ci-run.sh "cargo build --tests" cargo build --release --tests --target ${{ matrix.target }}

      - name: cargo test --release
        working-directory: src-tauri
        shell: bash
        run: bash ../scripts/ci-run.sh "cargo test" cargo test --release --no-fail-fast --target ${{ matrix.target }}

      - name: tauri build --debug
        shell: bash
        run: bash scripts/ci-run.sh "tauri build" npm run tauri build -- --debug --target ${{ matrix.target }}

      # `tauri build -- --debug` leaves an unminified, source-mapped `dist/` behind
      # (`vite.config.ts` keys `minify`/`sourcemap` off `TAURI_ENV_DEBUG`), which is 172 kB gz
      # critical path instead of 106. The gate has to see the artifact that ships, so the
      # production frontend is rebuilt first. `check-bundle-size.mjs` now exits 2 with that
      # explanation if it is ever pointed at a debug build again.
      - name: Production frontend build (what the size gate measures)
        run: npm run build

      - name: Bundle size gate
        run: node scripts/check-bundle-size.mjs

      # F-30. `--check` re-measures and compares against `docs/perf/baseline.json` with a
      # ±20 % tolerance, but only fails on the rows marked **gate** there: search hits,
      # serialised bytes, page counts and the frontend bundle. Every wall-clock row is
      # informational and printed with its delta — a GitHub-hosted runner shares its CPU, and
      # the recorded numbers include a 0.33 ms tile, so a ±20 % band around them is noise.
      # (Measured here: one `--check` run on the recording machine itself moved
      # `open.500p.ms` by +318 % purely from page-cache state.)
      #
      # macOS arm64 only: the baseline was recorded there, and comparing a timing or an RSS
      # across architectures says nothing. The `app` rows need a window and the `ocr` rows
      # need the generated fixtures, so both are skipped.
      - name: Performance baseline (F-30)
        if: matrix.name == 'macos-arm64'
        run: node scripts/perf-baseline.mjs --check --skip-app --skip-ocr

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: seepdf-${{ matrix.name }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            src-tauri/target/${{ matrix.target }}/debug/bundle/macos/*.app
            src-tauri/target/${{ matrix.target }}/debug/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/debug/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/debug/bundle/nsis/*.exe
